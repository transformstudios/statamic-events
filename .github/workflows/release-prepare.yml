name: Release Prepare

on:
  workflow_dispatch:

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require transformstudios/maintainers
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          state=$(gh api "orgs/transformstudios/teams/maintainers/memberships/${GITHUB_ACTOR}" --jq .state 2>/dev/null || true)
          if [ "$state" != "active" ]; then
            echo "::error::Only @transformstudios/maintainers can run Release Prepare (actor: ${GITHUB_ACTOR})"
            exit 1
          fi

  prepare:
    needs: authorize
    uses: edalzell/github-workflows/.github/workflows/release-prepare.yml@e6e4cc5fa42e6045c5c3428036f23d4462a072e7 # v1.5.1
    permissions:
      contents: write
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
